name: "MCP server: build and deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-server-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: true
          tags: |
            ghcr.io/pantavisor/docs-mcp-server:latest
            ghcr.io/pantavisor/docs-mcp-server:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"

      # No `kubectl apply` here: it needs a full multi-group API discovery
      # call up front to map every object in the manifest to its resource
      # type, and this CI credential gets "the server has asked for the
      # client to provide credentials" on that call even with
      # --validate=false. Other Pantacor services on this cluster hit the
      # same wall, so their Deployment/Service/Ingress is created once by
      # hand instead, and CI only ever does `set image` afterwards — same
      # convention here. Someone with full cluster access needs to run
      # `kubectl apply -f mcp-server/k8s/` once before this workflow's
      # first successful run.
      - name: Roll out new image
        run: |
          kubectl -n default set image deploy/pv-prod-docs-mcp-server \
            docs-mcp-server=ghcr.io/pantavisor/docs-mcp-server:${{ github.sha }}
          kubectl -n default rollout status deploy/pv-prod-docs-mcp-server
