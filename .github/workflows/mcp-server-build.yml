name: "MCP server: build and deploy"

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-server-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build image and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: mcp-server
          push: true
          tags: |
            ghcr.io/pantavisor/docs-mcp-server:latest
            ghcr.io/pantavisor/docs-mcp-server:${{ github.sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > "$HOME/.kube/config"

      # Bootstraps pv-prod-docs-mcp-server on first run; a no-op afterwards
      # (other Pantacor services on this cluster have their Deployment
      # created once out-of-band and CI only does `set image` — this repo
      # doesn't have that manual step yet, so apply covers it here too).
      # --validate=false: the CI credential isn't granted the cluster's
      # OpenAPI discovery endpoint (only the specific resources it manages),
      # so kubectl's default client-side schema validation fails with
      # "the server has asked for the client to provide credentials" before
      # it ever gets to applying anything.
      - name: Apply manifests
        run: kubectl -n default apply --validate=false -f mcp-server/k8s/

      - name: Roll out new image
        run: |
          kubectl -n default set image deploy/pv-prod-docs-mcp-server \
            docs-mcp-server=ghcr.io/pantavisor/docs-mcp-server:${{ github.sha }}
          kubectl -n default rollout status deploy/pv-prod-docs-mcp-server
